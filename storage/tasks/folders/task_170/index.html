<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Taschenrechner mit Funktionen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <h2>Taschenrechner mit Funktionen</h2>
    
    <div class="input-group">
      <label for="num1">Erste Zahl:</label>
      <input type="number" id="num1" data-element="a" placeholder="z.B. 10" step="any">
    </div>
    
    <div class="input-group">
      <label for="num2">Zweite Zahl:</label>
      <input type="number" id="num2" data-element="b" placeholder="z.B. 5" step="any">
    </div>
    
    <div class="button-group">
      <button class="btn btn-operation" data-run-python="true" data-run-name="plus">
        <span class="operator">+</span>
        Addition
      </button>
      <button class="btn btn-operation" data-run-python="true" data-run-name="minus">
        <span class="operator">−</span>
        Subtraktion
      </button>
      <button class="btn btn-operation" data-run-python="true" data-run-name="mal">
        <span class="operator">×</span>
        Multiplikation
      </button>
      <button class="btn btn-operation" data-run-python="true" data-run-name="geteilt">
        <span class="operator">÷</span>
        Division
      </button>
    </div>
    
    <div class="result-container">
      <label>Ergebnis:</label>
      <div class="result" data-element="result">---</div>
    </div>
  </div>
</body>
</html>
