<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <defs>
    <style>
      .b{fill:#ffffff;stroke:#4f46e5;stroke-width:2;rx:12;ry:12}
      .t{font:14px 'Segoe UI',Arial,sans-serif;fill:#111827}
      .h{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#111827}
      .a{stroke:#6b7280;stroke-width:2;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="20" y="40" width="190" height="90" class="b"/>
  <text x="38" y="70" class="h">1) Projekt öffnen</text>
  <text x="38" y="95" class="t">index.html + style.css + init.py</text>
  <text x="38" y="115" class="t">werden aus Dateien geladen</text>

  <rect x="250" y="40" width="210" height="90" class="b"/>
  <text x="268" y="70" class="h">2) HTML-Render</text>
  <text x="268" y="95" class="t">GUI im #gui-container</text>
  <text x="268" y="115" class="t">(bei erstem Run)</text>

  <rect x="500" y="40" width="210" height="90" class="b"/>
  <text x="518" y="70" class="h">3) Python Run</text>
  <text x="518" y="95" class="t">Pyodide führt init.py aus</text>
  <text x="518" y="115" class="t">import idegui as ui</text>

  <rect x="750" y="40" width="320" height="90" class="b"/>
  <text x="768" y="70" class="h">4) UI-Bindings</text>
  <text x="768" y="95" class="t">ui.get()/ui.set() lesen/schreiben</text>
  <text x="768" y="115" class="t">Elemente mit data-element="..."</text>

  <line x1="210" y1="85" x2="250" y2="85" class="a"/>
  <line x1="460" y1="85" x2="500" y2="85" class="a"/>
  <line x1="710" y1="85" x2="750" y2="85" class="a"/>

  <rect x="250" y="220" width="250" height="120" class="b"/>
  <text x="268" y="250" class="h">5a) Direkte Logik</text>
  <text x="268" y="275" class="t">Code läuft einmal pro Run</text>
  <text x="268" y="297" class="t">z.B. Berechnung + ui.set()</text>
  <text x="268" y="319" class="t">keine Trigger nötig</text>

  <rect x="560" y="220" width="360" height="120" class="b"/>
  <text x="578" y="250" class="h">5b) Event-Logik</text>
  <text x="578" y="275" class="t">Button: data-run-python="true"</text>
  <text x="578" y="297" class="t">+ data-run-name="funktion"</text>
  <text x="578" y="319" class="t">Python-Funktion(trigger) wird aufgerufen</text>

  <line x1="860" y1="130" x2="860" y2="220" class="a"/>
  <line x1="810" y1="130" x2="390" y2="220" class="a"/>

  <text x="20" y="390" class="t">Schematischer Ablauf idegui (Python + HTML)</text>
</svg>
